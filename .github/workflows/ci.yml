name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Сборка со всеми тестами: unit (contextLoads) + интеграционные на Testcontainers.
      # На runner'ах GitHub Actions Docker доступен из коробки, Testcontainers поднимет postgres:17-alpine.
      - name: Build and test
        run: ./mvnw -B clean install
