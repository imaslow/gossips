server:
  port: 8080

spring:
  application:
    name: gossips-gateway

gossips:
  clients:
    security: http://localhost:8081
    app: http://localhost:8082
  security:
    jwt:
      # Тот же секрет, что в security — gateway проверяет подпись локально.
      # ОБЯЗАТЕЛЬНО переопределить через env JWT_SECRET в любом окружении выше локалки.
      secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # liveness/readiness группы — для compose и будущего k8s
      probes:
        enabled: true

logging:
  # requestId проставляет RequestIdFilter из common (MDC), см. LoggingConfig.
  # Gateway пробрасывает его в security/app через интерсептор RestClientConfig.
  pattern:
    level: "%5p [requestId=%X{requestId}]"
